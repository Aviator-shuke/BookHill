<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>语音识别对照检查 · langLSRW</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 680px; margin: auto; padding: 16px; color: #202124; background: #f5f5ec; font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 8px 0; }
    section { margin: 12px 0; padding: 12px; background: #fffef7; border: 1px solid #d6d9ca; border-radius: 8px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 40px; padding: 6px 12px; border: 1px solid #b9c5b5; border-radius: 6px; background: #fff; color: inherit; font: inherit; }
    button[data-mode] { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    button.is-listening { background: #326b48; color: white; }
    button:disabled { opacity: .5; }
    #status, #summary, #words { overflow-wrap: anywhere; }
    #words { min-height: 48px; font-size: 18px; }
    audio, textarea { width: 100%; }
    textarea { height: 180px; padding: 8px; font: 12px/1.4 monospace; }
    small { color: #596254; }
  </style>
</head>
<body>
  <h1>语音识别对照检查</h1>
  <p>两项分别按住约 5 秒，说：<strong lang="en">I want to retire soon.</strong> 松开结束。</p>
  <p>首次弹出麦克风授权时，允许后重新按住测试。请将两项各测两次。</p>
  <small>只检查，不改变学习页面。识别使用浏览器自身服务；没有新增收费接口。录音和文字仅临时保留在本页，关闭后清除。</small>
  <section>
    <div class="actions">
      <button type="button" data-mode="recognition" title="按住只测试浏览器语音识别，不启动录音；松开结束">1. 按住：只识别</button>
      <button type="button" data-mode="both" title="按住同时测试识别与录音，与听说主页的收音方式对照；松开结束">2. 按住：识别＋录音</button>
    </div>
    <p id="status" role="status">准备检查浏览器支持情况……</p>
    <p id="words" aria-live="polite">识别文字会显示在这里。</p>
    <audio id="replay" controls title="回放本页第二项测试的录音"></audio>
  </section>
  <section>
    <p id="summary" aria-live="polite">完成两项后，这里显示对比结果。</p>
    <button id="copy" type="button" title="复制浏览器信息、事件顺序和错误代码；记录不包含录音及识别出的原话">复制诊断记录</button>
    <p><label for="report">诊断记录（不包含录音和原话）</label></p>
    <textarea id="report" readonly title="查看或手动复制本页的诊断记录"></textarea>
  </section>
  <a href="../../index.html" title="返回 langLSRW 学习主页">返回学习主页</a>
  <script src="speech.js?v=20261020-1"></script>
</body>
</html>
